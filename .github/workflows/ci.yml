name: CI Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

jobs:
  backend:
    name: Backend Build & Tests (Spring Boot)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Grant Execute Permissions for Maven Wrapper
        run: chmod +x services/mvnw

      - name: Build and Test Microservices
        run: ./services/mvnw -f services/pom.xml clean test

  frontend:
    name: Frontend Build & Tests (Angular)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/tienda-frontend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/tienda-frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Build Angular Application
        run: npm run build

      - name: Run Unit Tests with Headless Browser
        run: npm run test:headless

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E Tests
        run: npm run test:e2e
