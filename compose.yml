name: tienda-generica

x-service-common-env: &service-common-env
  SPRING_PROFILES_ACTIVE: distributed
  CONFIG_SERVER_URL: http://config-server-lb:8888
  SPRING_CLOUD_CONFIG_USERNAME: config
  SPRING_CLOUD_CONFIG_PASSWORD: ${CONFIG_PASSWORD}
  JWT_SECRET: ${JWT_SECRET:?Ejecute scripts/setup-env.ps1}
  SERVICES_USERS: http://user-service-lb:8081
  SERVICES_CUSTOMERS: http://customer-service-lb:8089
  SERVICES_SUPPLIERS: http://supplier-service-lb:8090
  SERVICES_PRODUCTS: http://catalog-service-lb:8082
  SERVICES_ORDERS: http://order-service-lb:8085

x-service-depends-on: &service-depends-on
  postgres:
    condition: service_healthy
  config-server-lb:
    condition: service_started

services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Ejecute scripts/setup-env.ps1}
      DB_PASSWORD: ${DB_PASSWORD:?Ejecute scripts/setup-env.ps1}
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./infra/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

  config-server-1:
    build:
      context: .
      dockerfile: services/Dockerfile
      args:
        SERVICE: config-server
    environment:
      CONFIG_PASSWORD: ${CONFIG_PASSWORD:?Ejecute scripts/setup-env.ps1}
  config-server-2:
    build:
      context: .
      dockerfile: services/Dockerfile
      args:
        SERVICE: config-server
    environment:
      CONFIG_PASSWORD: ${CONFIG_PASSWORD:?Ejecute scripts/setup-env.ps1}
  config-server-lb:
    image: nginx:1.27-alpine
    volumes:
      - ./infra/nginx/config-server-lb.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - config-server-1
      - config-server-2
    ports: ["127.0.0.1:8888:8888"]

  user-service-1:
    build:
      context: .
      dockerfile: services/Dockerfile
      args:
        SERVICE: user-service
    environment:
      <<: *service-common-env
      DB_URL: jdbc:postgresql://postgres:5432/users
      DB_USER: users
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on: *service-depends-on
  user-service-2:
    build:
      context: .
      dockerfile: services/Dockerfile
      args:
        SERVICE: user-service
    environment:
      <<: *service-common-env
      DB_URL: jdbc:postgresql://postgres:5432/users
      DB_USER: users
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on: *service-depends-on
  user-service-lb:
    image: nginx:1.27-alpine
    volumes:
      - ./infra/nginx/user-service-lb.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - user-service-1
      - user-service-2

  catalog-service-1:
    build:
      context: .
      dockerfile: services/Dockerfile
      args:
        SERVICE: catalog-service
    environment:
      <<: *service-common-env
      DB_URL: jdbc:postgresql://postgres:5432/catalog
      DB_USER: catalog
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on: *service-depends-on
  catalog-service-2:
    build:
      context: .
      dockerfile: services/Dockerfile
      args:
        SERVICE: catalog-service
    environment:
      <<: *service-common-env
      DB_URL: jdbc:postgresql://postgres:5432/catalog
      DB_USER: catalog
      DB_PASSWORD: ${DB_PASSWORD}
