  order-service-1:
    build:
      context: .
      dockerfile: services/Dockerfile
      args:
        SERVICE: order-service
    environment:
      <<: *service-common-env
      DB_URL: jdbc:postgresql://postgres:5432/orders
      DB_USER: orders
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on: *service-depends-on
  order-service-2:
    build:
      context: .
      dockerfile: services/Dockerfile
      args:
        SERVICE: order-service
    environment:
      <<: *service-common-env
      DB_URL: jdbc:postgresql://postgres:5432/orders
      DB_USER: orders
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on: *service-depends-on
  order-service-lb:
    image: nginx:1.27-alpine
    volumes:
      - ./infra/nginx/order-service-lb.conf:/etc/nginx/conf.d/default.conf:ro
