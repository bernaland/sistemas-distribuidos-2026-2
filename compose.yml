    volumes:
      - ./infra/nginx/gateway-lb.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - gateway-1
      - gateway-2
    ports: ["127.0.0.1:8080:8080"]

  tienda-frontend:
    build:
      context: .
      dockerfile: frontend/tienda-frontend/Dockerfile
    depends_on:
      gateway-lb:
        condition: service_started
    ports: ["127.0.0.1:4200:80"]

volumes:
  postgres-data:
