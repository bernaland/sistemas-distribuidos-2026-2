name: tienda-generica
services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Ejecute scripts/setup-env.ps1}
      DB_PASSWORD: ${DB_PASSWORD:?Ejecute scripts/setup-env.ps1}
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./infra/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
  config-server:
    build:
      context: .
      dockerfile: services/Dockerfile
      args:
        SERVICE: config-server
    environment:
      CONFIG_PASSWORD: ${CONFIG_PASSWORD:?Ejecute scripts/setup-env.ps1}
    ports: ["127.0.0.1:8888:8888"]
  user-service:
    build:
      context: .
      dockerfile: services/Dockerfile
      args:
        SERVICE: user-service
    environment:
      SPRING_PROFILES_ACTIVE: distributed
      CONFIG_SERVER_URL: http://config-server:8888
      SPRING_CLOUD_CONFIG_USERNAME: config
      SPRING_CLOUD_CONFIG_PASSWORD: ${CONFIG_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Ejecute scripts/setup-env.ps1}
      DB_URL: jdbc:postgresql://postgres:5432/users
      DB_USER: users
      DB_PASSWORD: ${DB_PASSWORD}
      SERVICES_USERS: http://user-service:8081
      SERVICES_CUSTOMERS: http://customer-service:8089
      SERVICES_SUPPLIERS: http://supplier-service:8090
      SERVICES_PRODUCTS: http://catalog-service:8082
      SERVICES_ORDERS: http://order-service:8085
    depends_on:
      postgres:
        condition: service_healthy
  catalog-service:
