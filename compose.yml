      DB_USER: payments
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on: *service-depends-on
  payment-service-2:
    build:
      context: .
      dockerfile: services/Dockerfile
      args:
        SERVICE: payment-service
    environment:
      <<: *service-common-env
      DB_URL: jdbc:postgresql://postgres:5432/payments
