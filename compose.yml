      DB_USER: carts
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on: *service-depends-on
  cart-service-2:
    build:
      context: .
      dockerfile: services/Dockerfile
      args:
        SERVICE: cart-service
    environment:
      <<: *service-common-env
      DB_URL: jdbc:postgresql://postgres:5432/carts
      DB_USER: carts
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on: *service-depends-on
  cart-service-lb:
    image: nginx:1.27-alpine
    volumes:
      - ./infra/nginx/cart-service-lb.conf:/etc/nginx/conf.d/default.conf:ro
