  catalog-service-lb:
    image: nginx:1.27-alpine
    volumes:
      - ./infra/nginx/catalog-service-lb.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - catalog-service-1
      - catalog-service-2

  inventory-service-1:
    build:
      context: .
      dockerfile: services/Dockerfile
      args:
        SERVICE: inventory-service
    environment:
      <<: *service-common-env
      DB_URL: jdbc:postgresql://postgres:5432/inventory
      DB_USER: inventory
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on: *service-depends-on
  inventory-service-2:
