  gateway-1:
    build:
      context: .
      dockerfile: services/Dockerfile
      args:
        SERVICE: gateway
    environment:
      SPRING_PROFILES_ACTIVE: distributed
      CONFIG_SERVER_URL: http://config-server-lb:8888
      SPRING_CLOUD_CONFIG_USERNAME: config
      SPRING_CLOUD_CONFIG_PASSWORD: ${CONFIG_PASSWORD}
      USER_SERVICE_URL: http://user-service-lb:8081
      CATALOG_SERVICE_URL: http://catalog-service-lb:8082
      INVENTORY_SERVICE_URL: http://inventory-service-lb:8083
      CART_SERVICE_URL: http://cart-service-lb:8084
      ORDER_SERVICE_URL: http://order-service-lb:8085
      PAYMENT_SERVICE_URL: http://payment-service-lb:8086
      NOTIFICATION_SERVICE_URL: http://notification-service-lb:8087
      ADMIN_SERVICE_URL: http://admin-service-lb:8088
      CUSTOMER_SERVICE_URL: http://customer-service-lb:8089
      SUPPLIER_SERVICE_URL: http://supplier-service-lb:8090
    depends_on:
      config-server-lb:
        condition: service_started
  gateway-2:
    build:
      context: .
      dockerfile: services/Dockerfile
      args:
        SERVICE: gateway
    environment:
      SPRING_PROFILES_ACTIVE: distributed
      CONFIG_SERVER_URL: http://config-server-lb:8888
      SPRING_CLOUD_CONFIG_USERNAME: config
      SPRING_CLOUD_CONFIG_PASSWORD: ${CONFIG_PASSWORD}
      USER_SERVICE_URL: http://user-service-lb:8081
      CATALOG_SERVICE_URL: http://catalog-service-lb:8082
      INVENTORY_SERVICE_URL: http://inventory-service-lb:8083
      CART_SERVICE_URL: http://cart-service-lb:8084
      ORDER_SERVICE_URL: http://order-service-lb:8085
      PAYMENT_SERVICE_URL: http://payment-service-lb:8086
      NOTIFICATION_SERVICE_URL: http://notification-service-lb:8087
      ADMIN_SERVICE_URL: http://admin-service-lb:8088
      CUSTOMER_SERVICE_URL: http://customer-service-lb:8089
      SUPPLIER_SERVICE_URL: http://supplier-service-lb:8090
