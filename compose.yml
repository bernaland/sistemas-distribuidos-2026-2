  admin-service-1:
    build:
      context: .
      dockerfile: services/Dockerfile
      args:
        SERVICE: admin-service
    environment:
      <<: *service-common-env
    depends_on:
      config-server-lb:
        condition: service_started
  admin-service-2:
    build:
