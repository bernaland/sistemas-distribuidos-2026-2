server:
  port: 8888
spring:
  application:
    name: config-server
  profiles:
    active: native
  cloud:
    config:
      server:
        native:
          search-locations: classpath:/config
  security:
    user:
      name: config
      password: ${CONFIG_PASSWORD}
management:
  endpoints:
    web:
      exposure:
        include: health,info
