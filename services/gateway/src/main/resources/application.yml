server:
  port: 8080
spring:
  application:
    name: api-gateway
  cloud:
    config:
      enabled: ${CONFIG_ENABLED:false}
    gateway:
      httpclient:
        connect-timeout: 3000
        response-timeout: 10s
      routes:
        - id: user-service
          uri: ${USER_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/users/**
        - id: catalog-service
          uri: ${CATALOG_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/products/**
        - id: cart-service
          uri: ${CART_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/api/cart/**
        - id: order-service
          uri: ${ORDER_SERVICE_URL:http://localhost:8085}
          predicates:
            - Path=/api/orders/**,/api/sales/**
        - id: customer-service
          uri: ${CUSTOMER_SERVICE_URL:http://localhost:8089}
          predicates:
            - Path=/api/customers/**
        - id: supplier-service
          uri: ${SUPPLIER_SERVICE_URL:http://localhost:8090}
          predicates:
            - Path=/api/suppliers/**
        - id: inventory-service
          uri: ${INVENTORY_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/inventory/**
        - id: payment-service
          uri: ${PAYMENT_SERVICE_URL:http://localhost:8086}
          predicates:
            - Path=/api/payments/**
        - id: notification-service
          uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8087}
          predicates:
            - Path=/api/notifications/**
        - id: admin-service
          uri: ${ADMIN_SERVICE_URL:http://localhost:8088}
          predicates:
            - Path=/api/reports/**,/api/admin/**
management:
  endpoints:
    web:
      exposure:
        include: health,info
