server:
  port: 8083
spring:
  cloud:
    config:
      enabled: ${CONFIG_ENABLED:false}
  application:
    name: inventory-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/inventory}
    username: ${DB_USER:inventory}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 900000
management:
  endpoints:
    web:
      exposure:
        include: health,info
