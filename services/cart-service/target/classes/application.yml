server:
  port: 8084

spring:
  application:
    name: cart-service
  datasource:
    url: jdbc:h2:mem:cartdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

app:
  cart:
    default-tax-rate: 0.19

logging:
  level:
    root: INFO
    com.uelbosque.cartservice: DEBUG
