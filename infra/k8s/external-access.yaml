apiVersion: v1
kind: Service
metadata:
  name: gateway-external
  labels:
    app.kubernetes.io/name: gateway-external
    app.kubernetes.io/part-of: tienda-generica
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: gateway
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30080
---
apiVersion: v1
kind: Service
metadata:
  name: tienda-frontend-external
  labels:
    app.kubernetes.io/name: tienda-frontend-external
    app.kubernetes.io/part-of: tienda-generica
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: tienda-frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 30420
